name: Refresh DHCS data

on:
  schedule:
    - cron: "23 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch source data
        run: python scripts/fetch.py

      - name: Normalize
        run: python scripts/normalize.py

      - name: Commit changes
        run: |
          if git diff --quiet -- data/facilities.csv; then
            echo "No change to facility data; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh DHCS facility data ($(date -u +%Y-%m-%d))"
          git push
